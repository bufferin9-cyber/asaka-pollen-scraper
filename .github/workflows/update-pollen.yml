name: Update Pollen Data

on:
  schedule:
    # 07:13, 15:13 JST = 22:13, 06:13 UTC(前日/当日)。混雑しやすい"きりの良い"分を避ける
    - cron: "13 22 * * *"
    - cron: "13 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pollen scraper
        run: python scraper/pollen_scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pollen.json
          git diff --cached --quiet && echo "no changes" || git commit -m "Update pollen data"
          git push
